[project]
name = "stackchan-bridge"
version = "0.1.0"
description = "xiaozhi WebSocket bridge: StackChan <-> Wyoming STT/TTS <-> Hermes api_server"
requires-python = ">=3.11"
dependencies = [
    "websockets>=15,<16",
    "wyoming>=1.5,<2",
    "httpx>=0.27,<1",
    "numpy>=2,<3",
    "opuslib>=3.0.1,<4",
    "soxr>=0.5,<1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools]
packages = ["stackchan_bridge"]
