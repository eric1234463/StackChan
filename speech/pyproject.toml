[project]
name = "stackchan-speech"
version = "0.1.0"
description = "Local Wyoming STT (mlx-whisper Cantonese) and TTS (Qwen3-TTS HK Cantonese, MLX) servers"
requires-python = ">=3.11,<3.14"
dependencies = [
    "wyoming>=1.5,<2",
    "numpy>=2,<3",
    "mlx-whisper>=0.4.3,<0.5",
    "mlx-audio>=0.6.3,<0.7",
    "zeroconf>=0.130",
]

[tool.setuptools]
packages = ["stackchan_speech"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
